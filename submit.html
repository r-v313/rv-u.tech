<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://formspree.io; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Submitting application | rv_u camp</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #070707;
        color: #f2f2f0;
        font-family: Arial, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .box {
        width: min(92vw, 520px);
        padding: 34px;
        border: 1px solid #292929;
        border-radius: 18px;
        background: #0c0c0c;
        text-align: center;
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.45);
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #f97316;
        margin: 0 auto 18px;
        box-shadow: 0 0 20px rgba(249, 115, 22, 0.65);
        animation: p 1s ease-in-out infinite alternate;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
      }
      p {
        margin: 0;
        color: #aaa;
        line-height: 1.7;
        font-size: 14px;
      }
      @keyframes p {
        to {
          opacity: 0.25;
          transform: scale(0.8);
        }
      }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="dot"></div>
      <h1 id="title">جارٍ تأمين بيانات التواصل</h1>
      <p id="copy">بنحفظ نسخة احتياطية من طلبك ثم هنفتح واتساب تلقائيًا.</p>
    </main>
    <script>
      (function () {
        "use strict";
        var STORAGE_KEY = "rvuApplicationPendingV2";
        var ENDPOINT = "https://formspree.io/f/xoeqykpq";
        var WHATSAPP_NUMBER = "201280499854";
        var raw = null,
          payload = null;
        try {
          raw = sessionStorage.getItem(STORAGE_KEY);
          payload = raw ? JSON.parse(raw) : null;
        } catch (_) {}
        if (!payload) {
          location.replace("./");
          return;
        }

        if (payload.language === "en") {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
          document.getElementById("title").textContent =
            "Securing your contact details";
          document.getElementById("copy").textContent =
            "Saving a backup of your application, then WhatsApp will open automatically.";
        }

        function buildWhatsApp(p) {
          var isArabic = p.language === "ar";
          return isArabic
            ? "طلب تقديم لانترفيو rv_u camp — أول دفعة أونلاين\n\nالاسم: " +
                p.name +
                "\nرقم واتسابي: " +
                p.phone +
                "\nالدولة: " +
                (p.country || "") +
                "\nالمستوى الحالي: " +
                p.level_display +
                "\nاشتغلت على Live Targets قبل كده؟ " +
                p.live_targets_display +
                "\nهدفي من الكامب: " +
                p.goal +
                "\n\nفاهم إن التقديم لا يعني قبول تلقائي، وإن مفيش باونتي مضمونة، والنتائج تعتمد على الاجتهاد والاستمرار."
            : "rv_u camp Interview Application — Online Cohort 01\n\nName: " +
                p.name +
                "\nMy WhatsApp number: " +
                p.phone +
                "\nCountry: " +
                (p.country || "") +
                "\nCurrent level: " +
                p.level_display +
                "\nHunted live targets before? " +
                p.live_targets_display +
                "\nGoal: " +
                p.goal +
                "\n\nI understand that applying does not guarantee acceptance or a bounty, and that results depend on consistent practice and effort.";
        }

        function goWhatsApp(status) {
          try {
            sessionStorage.setItem("rvuApplicationBackupStatusV2", status);
          } catch (_) {}
          var u = new URL("https://wa.me/" + WHATSAPP_NUMBER);
          u.searchParams.set("text", buildWhatsApp(payload));
          location.replace(u.href);
        }

        var fd = new FormData();
        [
          "submission_id",
          "name",
          "country",
          "country_code",
          "phone_local",
          "phone",
          "level",
          "level_display",
          "liveTargets",
          "live_targets_display",
          "goal",
          "language",
          "page_url",
          "referrer",
          "submitted_at",
          "utm_source",
          "utm_medium",
          "utm_campaign",
          "utm_content",
          "utm_term",
          "utm_id",
          "li_fat_id",
        ].forEach(function (k) {
          fd.append(k, payload[k] || "");
        });
        fd.append(
          "_subject",
          "New RVU Camp Application — " +
            (payload.name || "Applicant") +
            " — " +
            (payload.phone || "No phone"),
        );

        var controller = new AbortController();
        var timer = setTimeout(function () {
          controller.abort();
        }, 8000);
        fetch(ENDPOINT, {
          method: "POST",
          body: fd,
          headers: { Accept: "application/json" },
          signal: controller.signal,
        })
          .then(function (response) {
            clearTimeout(timer);
            if (!response.ok)
              throw new Error("Formspree HTTP " + response.status);
            return response.json().catch(function () {
              return {};
            });
          })
          .then(function () {
            goWhatsApp("success");
          })
          .catch(function () {
            clearTimeout(timer);
            goWhatsApp("error");
          });
      })();
    </script>
  </body>
</html>
