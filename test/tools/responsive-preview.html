<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RVU responsive layout review</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#191b20;color:#f6d997;font:14px system-ui}main{display:flex;gap:18px;align-items:start;justify-content:center}figure{margin:0;flex:none}figcaption{padding:0 0 12px;text-align:center}iframe{display:block;height:calc(100vh - 70px);border:1px solid #75603a;border-radius:6px;background:#070708}</style></head><body><main><figure><figcaption>320px</figcaption><iframe title="320px preview" width="320" data-preview="true"></iframe></figure><figure><figcaption>360px</figcaption><iframe title="360px preview" width="360" data-preview="true"></iframe></figure><figure><figcaption>390px</figcaption><iframe title="390px preview" width="390" data-preview="true"></iframe></figure></main><script>document.querySelectorAll("iframe[data-preview]").forEach(frame=>{frame.src="../?layout-review="+Date.now()});</script></body></html>
