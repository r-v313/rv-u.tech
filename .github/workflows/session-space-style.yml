name: Session space style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/session-space-style.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restyle closed curriculum session names
        shell: python
        run: |
          from pathlib import Path
          p = Path('overrides.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* curriculum-session-space-v3 */'
          patch = r'''

/* curriculum-session-space-v3 */
#curriculum .week-block:not(.is-open) .outcome-session{
  position:relative!important;
  overflow:hidden!important;
  border:1px solid rgba(255,255,255,.075)!important;
  border-radius:14px!important;
  background:
    radial-gradient(circle at 14% 22%,rgba(255,255,255,.16) 0 1px,transparent 1.4px),
    radial-gradient(circle at 82% 26%,rgba(249,115,22,.18) 0 1px,transparent 1.5px),
    radial-gradient(circle at 67% 78%,rgba(96,165,250,.13) 0 1px,transparent 1.4px),
    radial-gradient(circle at 28% 72%,rgba(255,255,255,.08) 0 1px,transparent 1.5px),
    radial-gradient(ellipse at 50% 115%,rgba(249,115,22,.07),transparent 58%),
    linear-gradient(145deg,#070707 0%,#030303 58%,#080604 100%)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025),inset 0 0 28px rgba(255,255,255,.012),0 10px 24px rgba(0,0,0,.22)!important;
  min-height:58px!important;
  padding:13px 18px!important;
}
#curriculum .week-block:not(.is-open) .outcome-session::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(249,115,22,.025),transparent);
  opacity:.8;
}
#curriculum .week-block:not(.is-open) .outcome-session h3{
  position:relative;
  z-index:1;
  margin:0!important;
  color:#f4eee8!important;
  font-weight:750!important;
  font-size:.9rem!important;
  line-height:1.5!important;
  letter-spacing:.005em!important;
  text-shadow:0 1px 0 #000,0 0 10px rgba(249,115,22,.07)!important;
}
#curriculum .week-block:not(.is-open) .outcome-session:hover{
  border-color:rgba(249,115,22,.22)!important;
  background:
    radial-gradient(circle at 14% 22%,rgba(255,255,255,.2) 0 1px,transparent 1.4px),
    radial-gradient(circle at 82% 26%,rgba(249,115,22,.25) 0 1px,transparent 1.5px),
    radial-gradient(circle at 67% 78%,rgba(96,165,250,.16) 0 1px,transparent 1.4px),
    radial-gradient(circle at 28% 72%,rgba(255,255,255,.1) 0 1px,transparent 1.5px),
    radial-gradient(ellipse at 50% 115%,rgba(249,115,22,.095),transparent 58%),
    linear-gradient(145deg,#080808 0%,#030303 58%,#0a0705 100%)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 12px 28px rgba(0,0,0,.3),0 0 18px rgba(249,115,22,.045)!important;
}
@media(max-width:620px){
  #curriculum .week-block:not(.is-open) .outcome-session{min-height:52px!important;padding:11px 14px!important;border-radius:12px!important}
  #curriculum .week-block:not(.is-open) .outcome-session h3{font-size:.83rem!important}
}
'''
          if marker not in css:
              p.write_text(css + patch, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/session-space-style.yml
          git add overrides.css
          git commit -m "Restyle curriculum session names with dark space cards"
          git push origin main
