name: Update about copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-about-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update copy exactly
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = 'التركيز على Web وAuthorization وAPIs وBusiness Logic وRecon workflows وpractical automation وبناء Methodology قابلة للتطوير.'
          new = 'التركيز على Web وAuthorization وAPIs وBusiness Logic وRecon workflows وpractical automation وبناء Methodology قابلة للتطوير بشكل عملي.'
          if old not in s:
              raise SystemExit('Practical Focus text not found')
          s = s.replace(old, new)

          kicker = '<span class="section-num i18n" data-ar="مش عارف مستواك مناسب للدفعة ولا لأ" data-en="NOT SURE IF YOUR LEVEL FITS">مش عارف مستواك مناسب للدفعة ولا لأ</span> '
          if kicker not in s:
              raise SystemExit('Level-check kicker not found')
          s = s.replace(kicker, '', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit final change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-about-copy.yml
          git add index.html
          git commit -m "Balance About copy and remove level-check kicker"
          git push
