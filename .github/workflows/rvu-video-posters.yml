name: RVU video poster build
on:
  push:
    branches: [main]
    paths:
      - '_maintenance/render_video_posters.py'
      - '.github/workflows/rvu-video-posters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Render generated fallback posters when no user originals are installed
        run: |
          if [ -f assets/RVU_CUSTOM_VIDEO_COVERS.txt ]; then
            echo "Original user-approved artwork is installed; preserving all four files."
          else
            python _maintenance/render_video_posters.py
          fi
      - name: Commit rendered WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rvu-video-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add premium topic-accurate RVU teaching video poster assets"
            git push origin HEAD:main
          fi
