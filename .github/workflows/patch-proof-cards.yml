name: Proof card layout patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-proof-cards.yml'
      - 'scripts/patch_proof_cards.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply requested edits
        run: python scripts/patch_proof_cards.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html overrides.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Balance proof cards and simplify camp labels"
          git push
