name: Clean apply schedule curriculum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-apply-schedule-curriculum.yml'
      - '.github/scripts/clean_apply_schedule_curriculum.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested site changes
        run: python .github/scripts/clean_apply_schedule_curriculum.py
      - name: Commit final changes and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-apply-schedule-curriculum.yml
          git rm .github/scripts/clean_apply_schedule_curriculum.py
          git add index.html overrides.css
          git commit -m "Clean application flow and restyle schedule curriculum"
          git push origin main
