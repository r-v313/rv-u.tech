name: Update legal bonus copy

on:
  push:
    paths:
      - '.github/workflows/update-legal-bonus-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run legal bonus copy update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Arabic legal bonus paragraph
        run: python .github/scripts/update_legal_bonus_copy.py
      - name: Commit copy update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Shorten Arabic legal bonus copy"
          git push
