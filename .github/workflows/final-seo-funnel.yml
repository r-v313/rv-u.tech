name: Final SEO and Funnel Update

on:
  push:
    paths:
      - '.github/workflows/final-seo-funnel.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run final SEO and funnel update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SEO and funnel updates
        run: python .github/scripts/final_seo_funnel.py
      - name: Validate JavaScript and production invariants
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          robots=Path('robots.txt').read_text(encoding='utf-8')
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          exact="window.RVU_CLARITY_PROJECT_ID='ydzz6gt587';window.clarity=window.clarity||function(){(window.clarity.q=window.clarity.q||[]).push(arguments);};(function(){const s=document.createElement('script');s.async=true;s.src='https://www.clarity.ms/tag/'+window.RVU_CLARITY_PROJECT_ID;s.referrerPolicy='no-referrer';document.head.appendChild(s);})();"
          assert exact in js
          assert "const introDuration=6000;" in js
          assert "Apply_Click" in js
          assert "Application_Form_Complete" in js
          assert "WhatsApp_Click" in js
          assert 'application/ld+json' in html
          assert 'https://rv-u.tech/#rvu-camp' in html
          assert 'https://rv-u.tech/#ramez-medhat' in html
          assert 'https://www.clarity.ms' in html and 'https://scripts.clarity.ms' in html
          assert 'Sitemap: https://rv-u.tech/sitemap.xml' in robots
          assert '<loc>https://rv-u.tech/</loc>' in sitemap
          print('Validation passed.')
          PY
      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/final_seo_funnel.py .github/workflows/final-seo-funnel.yml
          git add index.html app.js robots.txt
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m "Add SEO metadata and Clarity funnel tracking"
          git push
