name: Fix Clarity CSP

on:
  push:
    paths:
      - '.github/workflows/fix-clarity-csp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Clarity CSP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "script-src 'self' https://www.clarity.ms; script-src-elem 'self' https://www.clarity.ms;"
          new = "script-src 'self' https://www.clarity.ms https://scripts.clarity.ms; script-src-elem 'self' https://www.clarity.ms https://scripts.clarity.ms;"
          if old not in s:
              raise SystemExit('Expected CSP pattern not found; refusing to modify index.html')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Allow Clarity runtime script in CSP"
          git push
