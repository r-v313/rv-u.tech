name: Prune Dead CSS

on:
  push:
    paths:
      - '.github/workflows/prune-dead-css.yml'

permissions:
  contents: write

jobs:
  prune:
    if: github.event.head_commit.message == 'Run final dead CSS pruning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prune unreachable CSS selectors
        run: python .github/scripts/prune_dead_css.py
      - name: Validate final source
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          css=Path('styles.css').read_text(encoding='utf-8')
          assert '<!--' not in html
          assert '/*' not in js and '/*' not in css
          assert css.count('{') == css.count('}')
          assert './profile.webp' in html and './favicon.svg' in html
          assert './overrides.css' not in html
          for marker in ['radarCanvas','baseId=4471','week-accordion-toggle']:
              assert marker not in js
          print('Final source validation passed.')
          PY
      - name: Commit pruned production stylesheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/prune_dead_css.py .github/workflows/prune-dead-css.yml
          git add styles.css
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m "Prune unreachable production CSS"
          git push
