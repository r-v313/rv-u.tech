name: Compact Mentorship Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-mentorship-once.yml'

permissions:
  contents: write

jobs:
  compact-mentorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compact mentorship and remove hunt loop
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('index.html')
          js_path = Path('app.js')
          css_path = Path('styles.css')

          html = index_path.read_text(encoding='utf-8')
          start_marker = '<section id="included-section" tabindex="-1">'
          end_marker = '<section class="outcomes-section" id="outcomes-section" tabindex="-1">'
          start = html.find(start_marker)
          end = html.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Mentorship or Outcomes boundary not found')

          mentorship = '''<section id="included-section" tabindex="-1"><div class="container"><div class="section-head reveal"><span class="section-num i18n" data-ar="MENTORSHIP" data-en="MENTORSHIP">MENTORSHIP</span><h2 class="i18n" data-ar="الـMentorship" data-en="MENTORSHIP">الـMentorship</h2></div><div class="included-grid reveal compact-mentorship-grid"><div class="included-card highlight tilt-card"><span class="badge-top i18n" data-ar="انترفيو شخصي قبل القبول" data-en="Personal interview before acceptance">انترفيو شخصي قبل القبول</span><h3 class="i18n" data-ar="نفهم مستواك" data-en="Understand your level">نفهم مستواك</h3><p class="i18n" data-ar="مكالمة قبل القبول أفهم فيها مستواك وهدفك وأقولك بصراحة هل الدفعة مناسبة ليك أو محتاج تراجع إيه الأول." data-en="A short pre-admission call to understand your level and goal and tell you directly whether this cohort fits you or what to review first.">مكالمة قبل القبول أفهم فيها مستواك وهدفك وأقولك بصراحة هل الدفعة مناسبة ليك أو محتاج تراجع إيه الأول.</p></div><div class="included-card tilt-card"><span class="badge-top i18n" data-ar="تسجيلات خاصة بالدفعة" data-en="Private cohort recordings">تسجيلات خاصة بالدفعة</span><h3 class="i18n" data-ar="راجع أي سيشن" data-en="Review any session">راجع أي سيشن</h3><p class="i18n" data-ar="كل السيشنات متسجلة للدفعة عشان تراجع أي نقطة وتكمل التطبيق من غير ما تضيع منك خطوة." data-en="Every session is recorded for the cohort so you can revisit any point and continue practicing without losing a step.">كل السيشنات متسجلة للدفعة عشان تراجع أي نقطة وتكمل التطبيق من غير ما تضيع منك خطوة.</p></div><div class="included-card highlight tilt-card"><span class="badge-top i18n" data-ar="12 سيشن / من 2.5 لـ3 ساعات" data-en="12 sessions / 2.5 to 3 hours">12 سيشن / من 2.5 لـ3 ساعات</span><h3 class="i18n" data-ar="تصل لـ36 ساعة Live" data-en="Up to 36 live hours">تصل لـ36 ساعة Live</h3><p class="i18n" data-ar="12 سيشن Live خلال 6 أسابيع بإجمالي يصل لـ36 ساعة، ومحاضرة قانون الجرائم الإلكترونية زيادة عليهم." data-en="Twelve live sessions across six weeks totaling up to 36 hours, plus the cybercrime law session on top.">12 سيشن Live خلال 6 أسابيع بإجمالي يصل لـ36 ساعة، ومحاضرة قانون الجرائم الإلكترونية زيادة عليهم.</p></div><div class="included-card tilt-card"><span class="badge-top i18n" data-ar="متابعة يومية من 5 لـ7 مساء" data-en="Daily support from 5 to 7 PM">متابعة يومية من 5 لـ7 مساء</span><h3 class="i18n" data-ar="Support يومي" data-en="Daily support">Support يومي</h3><p class="i18n" data-ar="كل يوم من 5 لـ7 مساء للأسئلة ومراجعة الأفكار وحل المشاكل والـFeedback على طريقة تفكيرك." data-en="Daily 5–7 PM support for questions, idea review, blockers and direct feedback on your reasoning.">كل يوم من 5 لـ7 مساء للأسئلة ومراجعة الأفكار وحل المشاكل والـFeedback على طريقة تفكيرك.</p></div><div class="included-card highlight tilt-card"><span class="badge-top i18n" data-ar="3+ ساعات 1:1 لكل طالب" data-en="3+ hours of 1-on-1 per student">3+ ساعات 1:1 لكل طالب</span><h3 class="i18n" data-ar="1:1 أسبوعية" data-en="Weekly 1-on-1">1:1 أسبوعية</h3><p class="i18n" data-ar="حوالي 30 دقيقة فردية كل أسبوع لمراجعة تقدمك واللي موقفك والخطوة الجاية، ووقت إضافي لو احتجت." data-en="About 30 private minutes every week to review progress, blockers and your next step, with extra time when needed.">حوالي 30 دقيقة فردية كل أسبوع لمراجعة تقدمك واللي موقفك والخطوة الجاية، ووقت إضافي لو احتجت.</p></div><div class="included-card practice-track-card tilt-card"><span class="badge-top i18n" data-ar="زيادة فوق الكامب" data-en="Extra on top of the camp">زيادة فوق الكامب</span><h3 class="i18n" data-ar="Tasks عملية" data-en="Practical tasks">Tasks عملية</h3><p class="i18n" data-ar="Tasks منظمة من PortSwigger + Files ترتب تفكيرك، وبعدها نراجع النقط اللي وقفت معاك وطريقة الحل." data-en="Structured PortSwigger tasks plus files to organize your thinking, followed by review of blockers and reasoning.">Tasks منظمة من PortSwigger + Files ترتب تفكيرك، وبعدها نراجع النقط اللي وقفت معاك وطريقة الحل.</p></div></div><div class="mentorship-jewel reveal compact-mentorship-jewel"><span class="jewel-label i18n" data-ar="ليه Mentorship مع Ramez" data-en="WHY MENTORSHIP WITH RAMEZ">ليه Mentorship مع Ramez</span><h3 class="i18n" data-ar="المحتوى موجود لكن المشكلة في التوهان" data-en="The content exists but the problem is getting lost">المحتوى موجود لكن المشكلة في التوهان</h3><p class="i18n" data-ar="المحتوى موجود، لكن المشكلة غالبًا في ترتيب التعلم والتطبيق والـFeedback. هنا بنراجع تفكيرك على Targets حقيقية ونبني Methodology تقدر تكمل وتطورها لوحدك. والدفعة 12 طالب فقط عشان أتابع كل واحد شخصيًا، والـLive Hunting يتقسم 4 فرق × 3 طلاب؛ العدد جزء من التنفيذ مش رقم للتسويق." data-en="The content already exists; the real problem is organizing learning, practice and feedback. Here we review your reasoning on real targets and build a methodology you can continue evolving independently. The cohort is limited to 12 students so I can follow each person closely, with live hunting split into four teams of three; the limit is part of the delivery model, not a marketing number.">المحتوى موجود، لكن المشكلة غالبًا في ترتيب التعلم والتطبيق والـFeedback. هنا بنراجع تفكيرك على Targets حقيقية ونبني Methodology تقدر تكمل وتطورها لوحدك. والدفعة 12 طالب فقط عشان أتابع كل واحد شخصيًا، والـLive Hunting يتقسم 4 فرق × 3 طلاب؛ العدد جزء من التنفيذ مش رقم للتسويق.</p></div></div></section>'''

          html = html[:start] + mentorship + html[end:]
          index_path.write_text(html, encoding='utf-8')

          js = js_path.read_text(encoding='utf-8')
          js = js.replace(".tilt-card, .hunt-loop-step, .schedule-item, .outcome-session, .faq-item", ".tilt-card, .schedule-item, .outcome-session, .faq-item")
          js_path.write_text(js, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          compact_css = '''.compact-mentorship-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important}.compact-mentorship-grid .included-card{padding:16px 17px!important;min-height:0!important}.compact-mentorship-grid .badge-top{font-size:.67rem!important;margin-bottom:7px!important;padding:4px 8px!important}.compact-mentorship-grid h3{font-size:1rem!important;line-height:1.35!important;margin-bottom:5px!important}.compact-mentorship-grid p{font-size:.79rem!important;line-height:1.55!important;margin:0!important}.compact-mentorship-jewel{margin-top:16px!important;padding:17px 20px!important}.compact-mentorship-jewel .jewel-label{font-size:.68rem!important}.compact-mentorship-jewel h3{font-size:1.08rem!important;margin:5px 0 6px!important}.compact-mentorship-jewel p{font-size:.8rem!important;line-height:1.6!important;margin:0!important}@media(max-width:900px){.compact-mentorship-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}@media(max-width:620px){.compact-mentorship-grid{grid-template-columns:1fr!important;gap:9px!important}.compact-mentorship-grid .included-card{padding:14px 15px!important}.compact-mentorship-jewel{padding:15px 16px!important}}'''
          if compact_css not in css:
              css += compact_css
          css_path.write_text(css, encoding='utf-8')

      - name: Verify requested changes
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('app.js').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')

          required = [
              'compact-mentorship-grid',
              'compact-mentorship-jewel',
              '4 فرق × 3 طلاب',
              'id="outcomes-section"',
              'id="curriculum"',
              'id="contact"'
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Missing expected content: ' + ', '.join(missing))

          forbidden = [
              'class="hunt-loop-section"',
              'id="hunt-loop"',
              'THE HUNT LOOP',
              'طريقة التعلم</h2>',
              'class="capacity-note"'
          ]
          leftovers = [x for x in forbidden if x in html]
          if leftovers:
              raise SystemExit('Hunt Loop remnants in HTML: ' + ', '.join(leftovers))

          if '.hunt-loop-step, .schedule-item' in js:
              raise SystemExit('Hunt Loop JS selector still present')
          if 'compact-mentorship-grid' not in css:
              raise SystemExit('Compact mentorship CSS missing')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css
          git diff --cached --check
          git commit -m "Compact mentorship and remove Hunt Loop"
          git push origin main
