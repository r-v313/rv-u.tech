name: Final Production Freshen

on:
  push:
    paths:
      - '.github/workflows/final-freshen.yml'

permissions:
  contents: write

jobs:
  freshen:
    if: github.event.head_commit.message == 'Run final production freshen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freshen current production code
        run: python .github/scripts/final_freshen.py
      - name: Validate JavaScript and Clarity
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          js=Path('app.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('styles.css').read_text(encoding='utf-8')
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          exact="window.RVU_CLARITY_PROJECT_ID='ydzz6gt587';window.clarity=window.clarity||function(){(window.clarity.q=window.clarity.q||[]).push(arguments);};(function(){const s=document.createElement('script');s.async=true;s.src='https://www.clarity.ms/tag/'+window.RVU_CLARITY_PROJECT_ID;s.referrerPolicy='no-referrer';document.head.appendChild(s);})();"
          assert exact in js
          assert 'https://www.clarity.ms' in html
          assert 'https://scripts.clarity.ms' in html
          assert 'is-open' not in css
          assert '@media (min-width:981px)' in css
          assert '.offline-camp-lines{grid-template-columns:1fr!important' in css
          assert '<loc>https://rv-u.tech/</loc>' in sitemap
          assert css.count('{') == css.count('}')
          print('Validation passed; Clarity unchanged and sitemap present.')
          PY
      - name: Commit final production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/final_freshen.py .github/workflows/final-freshen.yml
          git add styles.css sitemap.xml
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m "Finalize desktop camp rows and fresh production CSS"
          git push
