name: Curriculum and schedule patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/curriculum-schedule-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply schedule pills and curriculum accordion
        shell: python
        run: |
          from pathlib import Path
          import base64
          css_path = Path('overrides.css')
          js_path = Path('app.js')
          css = css_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')
          css_patch = base64.b64decode('').decode('utf-8')
          js_patch = base64.b64decode('').decode('utf-8')
          if '/* schedule-pills-curriculum-accordion-v1 */' not in css:
              css_path.write_text(css + css_patch, encoding='utf-8')
          if '/* curriculum-accordion-v1 */' not in js:
              js_path.write_text(js + js_patch, encoding='utf-8')
      - name: Commit final change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/curriculum-schedule-patch.yml
          git add overrides.css app.js
          git commit -m "Make schedule pills and curriculum accordion"
          git push
