name: RVU website image optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rvu-optimize.yml'
      - '_maintenance/optimize_assets.py'
      - 'poc-*.png'
      - 'assets/ramez-medhat.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Create optimized evidence and portrait
        run: python _maintenance/optimize_assets.py
      - name: Commit optimized assets if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poc-0?-full.webp assets/ramez-medhat-640.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize report evidence and portrait for mobile bandwidth"
            git push origin HEAD:main
          fi
