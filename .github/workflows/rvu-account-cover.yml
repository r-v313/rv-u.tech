name: RVU Account Testing cover refinement
on:
  push:
    branches: [main]
    paths:
      - '_maintenance/refine_account_cover.py'
      - '.github/workflows/rvu-account-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  account-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install poster typography
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fontconfig
          fc-match -f '%{family}: %{file}\n' 'Inter Display:style=Black'
      - name: Install stable image-processing libraries
        run: |
          python -m pip install --no-cache-dir 'Pillow>=11,<13' 'numpy>=2,<3' 'opencv-python-headless>=4.10,<5'
      - name: Render the faithful cover and update only its card
        run: python _maintenance/refine_account_cover.py
      - name: Commit edited artwork and regression assertions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rvu-video-account-methodology.webp index.html _maintenance/verify.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Publish refined Account Testing cover below-shoulder panel"
            git push origin HEAD:main
          fi
