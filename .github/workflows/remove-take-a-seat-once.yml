name: Remove Take a Seat Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-take-a-seat-once.yml'

permissions:
  contents: write

jobs:
  remove-take-a-seat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Take a Seat HTML JS and CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          def remove_balanced_html(source, marker, tag):
              start = source.find(marker)
              if start == -1:
                  raise SystemExit(f'HTML marker not found: {marker}')
              token_re = re.compile(rf'<(/?){tag}\b[^>]*>', re.I)
              depth = 0
              end = None
              for m in token_re.finditer(source, start):
                  if m.group(1):
                      depth -= 1
                      if depth == 0:
                          end = m.end()
                          break
                  else:
                      depth += 1
              if end is None:
                  raise SystemExit(f'Could not find matching </{tag}> for {marker}')
              return source[:start] + source[end:]

          def remove_between(source, start_marker, next_marker, include_next=False):
              start = source.find(start_marker)
              if start == -1:
                  raise SystemExit(f'Start marker not found: {start_marker}')
              end = source.find(next_marker, start + len(start_marker))
              if end == -1:
                  raise SystemExit(f'End marker not found after: {start_marker}')
              if include_next:
                  end += len(next_marker)
              return source[:start] + source[end:]

          def remove_card_iife(source):
              marker = "(function(){const nameInput=document.getElementById('holoNameInput');"
              start = source.find(marker)
              if start == -1:
                  raise SystemExit('Take a Seat IIFE marker not found')
              boundary = source.find('})();(function(){', start)
              if boundary == -1:
                  raise SystemExit('Could not locate end of Take a Seat IIFE')
              return source[:start] + source[boundary + len('})();'):]

          index_path = Path('index.html')
          js_path = Path('app.js')
          css_path = Path('styles.css')

          # HTML: remove the entire Take a Seat section.
          html = index_path.read_text(encoding='utf-8')
          html = remove_balanced_html(html, '<section id="badge-preview-section"', 'section')
          index_path.write_text(html, encoding='utf-8')

          # JS: remove all card-only behavior and the small shared hooks that referenced it.
          js = js_path.read_text(encoding='utf-8')
          js = remove_between(
              js,
              'window.updateCardName=function(val){',
              "(function(){const preloader=document.getElementById('preloader');"
          )
          js = remove_card_iife(js)

          js = js.replace(
              "const nameInput=document.getElementById('holoNameInput');if(typeof window.updateCardName==='function'){window.updateCardName(nameInput?nameInput.value:'');}",
              ''
          )
          js = js.replace("if(typeof window.resetDownloadBtn==='function')window.resetDownloadBtn();", '')
          js = js.replace("if(card.id==='holoCard'||card.classList.contains('holo-box'))return;", '')
          js_path.write_text(js, encoding='utf-8')

          # CSS: remove every card-specific rule, including responsive rules and holo keyframes.
          css = css_path.read_text(encoding='utf-8')

          simple_rule = re.compile(
              r'[^{}]*(?:holo|badge-preview-section|sig-name)[^{}]*\{[^{}]*\}',
              re.I
          )
          previous = None
          while previous != css:
              previous = css
              css = simple_rule.sub('', css)

          def remove_named_keyframes(text):
              pattern = re.compile(r'@(?:-webkit-)?keyframes\s+[^\s{]*holo[^\s{]*\s*\{', re.I)
              while True:
                  m = pattern.search(text)
                  if not m:
                      return text
                  open_idx = text.find('{', m.start())
                  depth = 0
                  i = open_idx
                  while i < len(text):
                      if text[i] == '{':
                          depth += 1
                      elif text[i] == '}':
                          depth -= 1
                          if depth == 0:
                              text = text[:m.start()] + text[i+1:]
                              break
                      i += 1
                  else:
                      raise SystemExit('Unclosed holo keyframes block')

          css = remove_named_keyframes(css)
          css_path.write_text(css, encoding='utf-8')

      - name: Verify card code is completely gone
        shell: python
        run: |
          from pathlib import Path

          files = {
              'index.html': Path('index.html').read_text(encoding='utf-8'),
              'app.js': Path('app.js').read_text(encoding='utf-8'),
              'styles.css': Path('styles.css').read_text(encoding='utf-8'),
          }

          forbidden_by_file = {
              'index.html': [
                  'badge-preview-section', 'holoNameInput', 'downloadHoloBtn',
                  'shareHoloBtn', 'holoCard', 'Take a Seat', 'TAKE A SEAT',
                  'Download Your Card', 'Share On WhatsApp/Story'
              ],
              'app.js': [
                  'holo', 'updateCardName', 'resetDownloadBtn', 'renderCampCardCanvas',
                  'TAKE A SEAT', 'Take a Seat', 'MENTORSHIP PASS', 'Download Camp Card'
              ],
              'styles.css': [
                  'holo', 'badge-preview-section', 'sig-name'
              ],
          }

          leftovers = []
          for name, tokens in forbidden_by_file.items():
              text = files[name]
              for token in tokens:
                  if token.lower() in text.lower():
                      leftovers.append(f'{name}: {token}')
          if leftovers:
              raise SystemExit('Card remnants found: ' + ', '.join(leftovers))

          required_html = [
              'id="preloader"', 'id="about"', 'id="previous-camps"',
              'id="included-section"', 'id="hunt-loop"', 'id="outcomes-section"',
              'id="curriculum"', 'id="legal-bonus-section"', 'id="execution"',
              'id="contact"', 'id="faq-section"'
          ]
          missing = [x for x in required_html if x not in files['index.html']]
          if missing:
              raise SystemExit('Unexpected missing site sections: ' + ', '.join(missing))

          required_js = [
              "document.getElementById('preloader')",
              "document.getElementById('applicationModal')"
          ]
          missing_js = [x for x in required_js if x not in files['app.js']]
          if missing_js:
              raise SystemExit('Unexpected missing JS: ' + ', '.join(missing_js))

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css
          git diff --cached --check
          git commit -m "Remove Take a Seat card and all related code"
          git push origin main
