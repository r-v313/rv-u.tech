<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=8,user-scalable=yes,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08090b">
<meta name="referrer" content="same-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
<title>عرض تقرير | RVU Camp</title>
<link rel="icon" href="./favicon-96.png" type="image/png">
<link rel="stylesheet" href="./viewer.css?v=20261026-v1">
<script defer src="./viewer.js?v=20261026-v1"></script>
</head>
<body>
<main id="viewer" aria-label="عارض التقرير">
<div id="image-surface" role="region" tabindex="0" aria-label="الصورة، كبّر بإصبعين وحرّك بإصبع">
<img id="full-image" alt="" draggable="false">
</div>
<header class="viewer-toolbar">
<a id="close-viewer" class="close" href="/#research" aria-label="إغلاق والعودة للتقارير" title="إغلاق">×</a>
<div class="viewer-title"><strong id="viewer-heading">تقرير أمني</strong><span id="viewer-hint">كبّر بإصبعين، وحرّك الصورة بإصبع واحد</span></div>
<div class="viewer-controls">
<button type="button" id="zoom-out" aria-label="تصغير" title="تصغير">−</button>
<output id="zoom-level" aria-live="off">100%</output>
<button type="button" id="zoom-in" aria-label="تكبير" title="تكبير">+</button>
<button type="button" id="zoom-reset" aria-label="إعادة الحجم الأصلي" title="إعادة الحجم">↺</button>
</div>
</header>
<p id="viewer-error" role="alert" hidden>تعذّر تحميل الصورة. ارجع للتقارير وحاول مرة تانية.</p>
</main>
</body>
</html>
